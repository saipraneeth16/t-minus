# Officer / admin sign-in passcodes, stored as SHA-256 hashes only (safe to commit:
# a hash of a long random passcode cannot be turned back into the passcode).
# Sign in with any display name plus the passcode itself. These work in addition to
# OFFICER_PASSCODE / ADMIN_PASSCODE from the environment.
#
# To add or rotate one, hash the new passcode and replace the line:
#   python -c "import hashlib,getpass; print(hashlib.sha256(getpass.getpass().encode()).hexdigest())"
# Deleting a line revokes that passcode on the next deploy.
credentials:
